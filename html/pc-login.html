    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .loading-spinner {
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 2px solid #fff;
            width: 18px;
            height: 18px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

<body class="bg-background text-on-surface font-body-md min-h-screen">
    <main class="flex flex-col min-h-screen p-gutter gap-gutter items-center justify-center">
        <!-- DESKTOP VERSION CONTAINER (SIDE BY SIDE PREVIEW) -->
        <div class="w-full max-w-[1440px] h-[900px] shadow-2xl rounded-xl overflow-hidden border border-border flex">
            <!-- Left Column: Branding & Illustration -->
            <div class="w-1/2 bg-primary-container p-12 flex flex-col justify-between relative overflow-hidden">
                <div class="z-10">
                    <h1 class="text-white font-headline-lg text-headline-lg font-extrabold tracking-tight">MebPro</h1>
                    <p class="text-on-primary-container text-body-lg font-body-lg mt-2">Chào mừng trở lại!</p>
                </div>
                <div class="relative z-10 flex flex-col items-center">
                    <div
                        class="w-full rounded-xl overflow-hidden shadow-2xl transform hover:scale-[1.02] transition-transform duration-500 border border-white/20">
                        <img alt="Giao diện học tập y khoa chuyên nghiệp" class="w-full object-cover"
                            src="https://lh3.googleusercontent.com/aida/AP1WRLv_p2rdQZm0QQ4HvbOfjWopS8En2e5kGHO6v7tyXV3e0jRVKf5mWIcMZc5_oq8ifygyXE5b7z672n2t_r74rpWb4TDXrHyM7iKQSkSlnUJdXgJoq6OE4tprXxLOP0gxlo2YJtAemTUVE3g03K1IgJ_25DBeV9a9anSstVhbpiLRASFVWDnT9UedXkXeGddCz1blvvS5VY3Yh4NyV09frO4ywaIMeH0HGe-veAamQR8wvchErRMU7KYFjDM">
                    </div>
                    <div class="mt-8 text-center text-white/90">
                        <p class="font-headline-sm text-headline-sm">Làm chủ kiến thức y khoa</p>
                        <p class="text-body-md opacity-80 mt-2">Nền tảng ôn luyện thông minh dành cho bác sĩ tương lai
                        </p>
                    </div>
                </div>
                <!-- Abstract background shapes -->
                <div class="absolute top-[-10%] right-[-10%] w-64 h-64 bg-primary rounded-full blur-3xl opacity-30">
                </div>
                <div
                    class="absolute bottom-[-5%] left-[-5%] w-80 h-80 bg-on-primary-fixed-variant rounded-full blur-3xl opacity-20">
                </div>
            </div>
            <!-- Right Column: Login Form -->
            <div class="w-1/2 bg-surface p-16 flex flex-col justify-center">
                <div class="max-w-md mx-auto w-full">
                    <h2 class="font-headline-md text-headline-md text-on-surface mb-8">Đăng nhập</h2>
                    <!-- Error State Banner -->
                    <div
                        class="mb-6 flex items-center gap-3 p-4 bg-error-container text-on-error-container border border-error/20 rounded-lg">
                        <span class="material-symbols-outlined text-[20px]">error</span>
                        <p class="text-label-md font-label-md">Email hoặc mật khẩu không đúng</p>
                    </div>
                    <form class="space-y-5" onsubmit="return false">
                        <div class="space-y-1.5">
                            <label class="text-label-md font-label-md text-on-surface-variant"
                                for="email-desktop">Email</label>
                            <input
                                class="w-full px-4 py-2.5 border border-border rounded-xl focus:ring-2 focus:ring-primary focus:border-primary transition-all outline-none"
                                id="email-desktop" placeholder="bacsi@mebpro.vn" type="email">
                        </div>
                        <div class="space-y-1.5">
                            <label class="text-label-md font-label-md text-on-surface-variant"
                                for="password-desktop">Mật khẩu</label>
                            <div class="relative">
                                <input
                                    class="w-full px-4 py-2.5 border border-border rounded-xl focus:ring-2 focus:ring-primary focus:border-primary transition-all outline-none"

                                <button
                                    class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary"
                                    type="button">
                                    <span class="material-symbols-outlined">visibility</span>

                            </div>
                        </div>
                        <div class="flex items-center justify-between py-1">

                        <!-- Login Button with Loading State -->

                        <button

                                src="https://upload.wikimedia.org/wikipedia/commons/b/b8/2021_Facebook_icon.svg">

                    </p>

            </div>
        </div>
        <!-- MOBILE VERSION CONTAINER -->
    </main>
    <script>
        // Simple password toggle logic for demo
        document.querySelectorAll('button:has(.material-symbols-outlined)').forEach(btn => {
            btn.addEventListener('click', function () {
                const icon = this.querySelector('.material-symbols-outlined');
                const input = this.parentElement.querySelector('input');
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.textContent = 'visibility_off';
                } else {
                    input.type = 'password';
                    icon.textContent = 'visibility';
                }
            });
        });

        // Atmospheric micro-interaction for the illustration container (desktop)
        const desktopIllu = document.querySelector('.xl\\:flex img');
        if (desktopIllu) {
            desktopIllu.parentElement.addEventListener('mousemove', (e) => {
                const { left, top, width, height } = desktopIllu.parentElement.getBoundingClientRect();
                const x = (e.clientX - left) / width - 0.5;
                const y = (e.clientY - top) / height - 0.5;
                desktopIllu.style.transform = `perspective(1000px) rotateY(${x * 10}deg) rotateX(${-y * 10}deg) scale(1.05)`;
            });
            desktopIllu.parentElement.addEventListener('mouseleave', () => {
                desktopIllu.style.transform = `perspective(1000px) rotateY(0deg) rotateX(0deg) scale(1)`;
            });
        }
    </script>
