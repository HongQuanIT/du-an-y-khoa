<!DOCTYPE html>
<html class="light" lang="vi">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link
        href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=block"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">try {
            tailwind.config = {
                darkMode: "class",
                theme: {
                    extend: {
                        "colors": {
                            "primary": "#005c55",
                            "primary-container": "#0f766e",
                            "secondary": "#0051d5",
                            "background": "#F8FAFC",
                            "surface": "#FFFFFF",
                            "error": "#DC2626",
                            "error-container": "#FEE2E2",
                            "outline": "#6e7977",
                            "border": "#E2E8F0",
                            "text-secondary": "#64748B",
                            "on-surface": "#131b2e",
                            "on-primary": "#ffffff"
                        },
                        "borderRadius": {
                            "DEFAULT": "0.25rem",
                            "lg": "0.5rem",
                            "xl": "12px",
                            "full": "9999px"
                        },
                        "spacing": {
                            "margin-mobile": "16px",
                            "gutter": "24px",
                            "container-max": "1280px",
                            "base-unit": "4px"
                        },
                        "fontFamily": {
                            "body": ["Be Vietnam Pro", "sans-serif"],
                            "display": ["Be Vietnam Pro", "sans-serif"]
                        }
                    },
                },
            }
        } catch (_e) { }</script>
</head>

<body class="bg-background text-on-surface min-h-screen flex flex-col items-center">
    <!-- Mobile Container -->
    <div class="w-full max-w-[430px] min-h-screen bg-surface flex flex-col shadow-xl">
        <!-- Header -->
        <header class="px-margin-mobile py-6 flex items-center justify-center border-b border-border">
            <div class="flex items-center gap-2">
                <span class="material-symbols-outlined text-primary-container text-3xl"
                    data-original-icon="medical_services">medical_services</span>
                <span class="text-2xl font-bold text-primary-container tracking-tight">MebPro</span>
            </div>
        </header>
        <!-- Main Content -->
        <main class="flex-1 px-margin-mobile py-8">
            <div class="mb-8">
                <h1 class="text-2xl font-bold text-on-surface mb-2">Đăng nhập</h1>
                <p class="text-text-secondary text-sm">Chào mừng bạn trở lại với hệ thống quản lý y tế MebPro.</p>
            </div>
            <!-- Error Banner -->
            <div class="bg-error-container border border-red-200 rounded-xl p-4 mb-6 flex items-start gap-3">
                <span class="material-symbols-outlined text-error text-[20px]">error</span>
                <p class="text-error text-sm font-medium">Email hoặc mật khẩu không đúng</p>
            </div>
            <!-- Login Form -->
            <form class="space-y-5" onsubmit="return false;">
                <div>
                    <label class="block text-sm font-semibold mb-2 text-on-surface" for="email">Email</label>
                    <input type="email" id="email" placeholder="bacsi@mebpro.vn"
                        class="w-full px-4 py-3 rounded-xl border border-border focus:ring-2 focus:ring-primary-container focus:border-primary-container outline-none transition-all">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-2 text-on-surface" for="password">Mật khẩu</label>
                    <div class="relative">
                        <input type="password" id="password" placeholder="••••••••"
                            class="w-full px-4 py-3 rounded-xl border border-border focus:ring-2 focus:ring-primary-container focus:border-primary-container outline-none transition-all">
                        <button type="button"
                            class="absolute right-4 top-1/2 -translate-y-1/2 text-text-secondary hover:text-on-surface"
                            onclick="togglePassword()">
                            <span id="pass-icon" class="material-symbols-outlined text-[20px]">visibility</span>
                        </button>
                    </div>
                </div>
                <div class="flex items-center justify-between py-1">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox"
                            class="w-4 h-4 rounded border-border text-primary-container focus:ring-primary-container">
                        <span class="text-sm text-on-surface">Ghi nhớ đăng nhập</span>
                    </label>
                    <a href="#" class="text-sm font-semibold text-primary-container hover:underline">Quên mật khẩu?</a>
                </div>
                <button type="submit"
                    class="w-full bg-primary-container text-white font-bold py-4 rounded-xl hover:opacity-90 active:scale-[0.98] transition-all shadow-md">
                    Đăng nhập
                </button>
            </form>
            <!-- Divider -->
            <div class="relative my-8">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-border"></div>
                </div>
                <div class="relative flex justify-center text-sm">
                    <span class="bg-surface px-4 text-text-secondary">hoặc tiếp tục với</span>
                </div>
            </div>
            <!-- Social Buttons -->
            <div class="grid grid-cols-3 gap-4"><button
                    class="flex items-center justify-center py-3 border border-border rounded-xl hover:bg-slate-50 transition-colors">
                    <svg class="w-6 h-6" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                            fill="#4285F4"></path>
                        <path
                            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                            fill="#34A853"></path>
                        <path
                            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"
                            fill="#FBBC05"></path>
                        <path
                            d="M12 5.38c1.62 0 3.06.56 4.21 1.66l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                            fill="#EA4335"></path>
                    </svg>
                </button>
                <button
                    class="flex items-center justify-center py-3 border border-border rounded-xl hover:bg-slate-50 transition-colors">
                    <svg class="w-6 h-6" fill="#1877F2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z">
                        </path>
                    </svg>
                </button>
                <button
                    class="flex items-center justify-center py-3 border border-border rounded-xl hover:bg-slate-50 transition-colors">
                    <svg class="w-6 h-6" fill="#0A66C2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z">
                        </path>
                    </svg>
                </button>
            </div>
        </main>
        <!-- Footer -->
        <footer class="p-margin-mobile py-8 mt-auto text-center">
            <p class="text-sm text-text-secondary">
                Chưa có tài khoản?</p>
        </footer>
    </div>
</body>

</html>
