; Application PHP settings (performance-first).
memory_limit = 512M
max_execution_time = 60
upload_max_filesize = 64M
post_max_size = 68M
max_input_vars = 5000
expose_php = Off
date.timezone = UTC

; Realpath cache speeds up file lookups on large codebases.
realpath_cache_size = 4096k
realpath_cache_ttl = 600
