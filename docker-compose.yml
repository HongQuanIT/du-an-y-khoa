# MedLearn — local development stack.
# Bring up with: docker compose up -d --build

x-php: &php
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: dev
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  volumes:
    - .:/var/www/html
  env_file:
    - .env
  networks:
    - medlearn
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  # ------------------------- Application (PHP-FPM) -------------------------
  app:
    <<: *php
    healthcheck:
      test: ["CMD", "php-fpm-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ------------------------------ Web (Nginx) ------------------------------
  web:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - medlearn

  # ---------------------- Vite dev server (frontend) -----------------------
  vite:
    image: node:20-alpine
    working_dir: /var/www/html
    command: sh -c "npm install && npm run dev -- --host --port ${VITE_PORT:-5173}"
    ports:
      # Đổi VITE_PORT nếu 5173 đã bị chiếm; dời cả host lẫn container để HMR khớp.
      - "${VITE_PORT:-5173}:${VITE_PORT:-5173}"
    environment:
      VITE_PORT: ${VITE_PORT:-5173}
    volumes:
      - .:/var/www/html
    networks:
      - medlearn

  # -------------------------- Queue worker (Horizon) -----------------------
  horizon:
    <<: *php
    command: php artisan horizon
    healthcheck:
      test: ["CMD", "php", "artisan", "horizon:status"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ------------------------------- Scheduler -------------------------------
  scheduler:
    <<: *php
    command: php artisan schedule:work

  # -------------------------- WebSocket (Reverb) ---------------------------
  reverb:
    <<: *php
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      # Nội bộ container luôn 8080; đổi FORWARD_REVERB_PORT khi host trùng cổng.
      - "${FORWARD_REVERB_PORT:-8080}:8080"

  # -------------------------------- MySQL 8 --------------------------------
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-medlearn}
      MYSQL_USER: ${DB_USERNAME:-medlearn}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      # Host-side port (đổi qua FORWARD_DB_PORT để tránh đụng MySQL trên máy);
      # bên trong network container vẫn luôn là 3306.
      - "${FORWARD_DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - medlearn

  # --------------------------------- Redis ---------------------------------
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      # Host-side port; nội bộ container luôn 6379 (app nối redis:6379).
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - medlearn

  # ------------------------------ Meilisearch ------------------------------
  meilisearch:
    image: getmeili/meilisearch:v1.10
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_KEY:-masterKeyChangeMe}
      MEILI_ENV: development
    ports:
      - "${FORWARD_MEILI_PORT:-7700}:7700"
    volumes:
      - meili-data:/meili_data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - medlearn

  # ------------------------ Object storage (MinIO) -------------------------
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-medlearn}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-medlearnsecret}
    ports:
      - "${FORWARD_MINIO_PORT:-9000}:9000"
      - "${FORWARD_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - medlearn

  # Creates the app bucket on first boot, then exits.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${AWS_ACCESS_KEY_ID:-medlearn} ${AWS_SECRET_ACCESS_KEY:-medlearnsecret} &&
      mc mb --ignore-existing local/${AWS_BUCKET:-medlearn} &&
      mc anonymous set download local/${AWS_BUCKET:-medlearn} || true
      "
    networks:
      - medlearn

  # ------------------------------- Mailpit ---------------------------------
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${FORWARD_MAILPIT_SMTP_PORT:-1025}:1025"
      - "${FORWARD_MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - medlearn

networks:
  medlearn:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  meili-data:
  minio-data:
